<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Glowloop thumbnails</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #11131c;
        color: #e8e8f0;
        font: 14px/1.4 system-ui, sans-serif;
      }
      #status {
        margin-bottom: 16px;
      }
      #shots {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-start;
      }
      figure {
        margin: 0;
      }
      img {
        display: block;
        max-height: 320px;
        max-width: 100%;
        border-radius: 6px;
      }
      figcaption {
        margin-top: 4px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="status">Rendering…</div>
    <div id="shots"></div>
    <script type="module">
      // Store thumbnails rendered with the game's own renderer. No text or logos,
      // since Playables thumbnails must not carry branding.
      import { Game, COLORS } from '../src/js/game.js';
      import { Renderer } from '../src/js/render.js';

      const SIZES = [
        ['landscape-16x9', 1920, 1080],
        ['landscape-4x3', 1440, 1080],
        ['square-1x1', 1080, 1080],
        ['portrait-3x4', 1080, 1440],
        ['portrait-2x3', 1080, 1620],
        ['portrait-9x16', 1080, 1920],
      ];
      const SCALE = 2; // render at half size with 2x pixel density

      function seeded(seed) {
        return () => {
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const silent = new Proxy({}, { get: () => () => {} });

      function stage(W, H) {
        const game = new Game(silent, { best: 0 });
        game.resize(W, H);
        game.resetWorld();
        game.state = 'showcase';
        game.clock = 10;
        const U = game.U;
        const rand = Math.random;
        const wide = W / H;

        // Positions as fractions of the frame, per shape of thumbnail.
        const L =
          wide > 1.2
            ? { hero: [0.44, 0.54], aqua: [0.8, 0.66], pink: [0.2, 0.74], lime: [0.66, 0.2], blue: [0.12, 0.45], gold: [0.2, 0.26] }
            : wide < 0.85
              ? { hero: [0.5, 0.54], aqua: [0.76, 0.8], pink: [0.2, 0.8], lime: [0.55, 0.13], blue: [0.12, 0.45], gold: [0.2, 0.2] }
              : { hero: [0.42, 0.5], aqua: [0.8, 0.82], pink: [0.18, 0.8], lime: [0.6, 0.12], blue: [0.1, 0.42], gold: [0.18, 0.18] };

        const flock = (c, n, x, y, spread) => {
          for (let i = 0; i < n; i++) {
            const a = rand() * Math.PI * 2;
            const r = Math.sqrt(rand()) * spread;
            game.fireflies.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r * 0.85, c, ph: Math.PI / 2 + (rand() - 0.5) * 1.4, alpha: 1 });
          }
        };

        // Hero: a big gold flock with the loop almost closed around it.
        const cx = W * L.hero[0];
        const cy = H * L.hero[1];
        const R = Math.min(W, H) * 0.27;
        flock(0, 10, cx, cy, R * 0.55);
        const pts = [];
        const start = -0.5;
        for (let a = 0; a <= Math.PI * 2 * 0.9; a += 0.09) {
          const wob = 1 + Math.sin(a * 3) * 0.04;
          pts.push({ x: cx + Math.cos(start + a) * R * wob, y: cy + Math.sin(start + a) * R * 0.9 * wob, t: game.clock - 0.6 + a * 0.1 });
        }
        game.trail.pts = pts;
        game.trail.active = true;
        game.trail.length = R * Math.PI * 2 * 0.9;
        const head = pts[pts.length - 1];
        for (let i = 0; i < 26; i++) {
          const a = rand() * Math.PI * 2;
          const d = rand() * 22 * U;
          game.particles.push({ x: head.x + Math.cos(a) * d, y: head.y + Math.sin(a) * d, t: rand() * 0.2, life: 0.5, color: '#FFE7A3', size: (1 + rand() * 1.6) * U });
        }

        // A pure aqua loop that just closed, its fireflies flying off to the lantern.
        const ax = W * L.aqua[0];
        const ay = H * L.aqua[1];
        const ar = Math.min(W, H) * 0.12;
        const poly = Array.from({ length: 36 }, (_, i) => {
          const a = (i / 36) * Math.PI * 2;
          return { x: ax + Math.cos(a) * ar * (1 + Math.sin(a * 4) * 0.05), y: ay + Math.sin(a) * ar * 0.85 };
        });
        game.flashes.push({ poly, t: 0.1, life: 0.55, color: COLORS[1].hex, bad: false });
        game.rings.push({ x: ax, y: ay, r0: 10 * U, r1: ar * 2.2, t: 0.18, life: 0.5, color: COLORS[1].hex });
        for (let i = 0; i < 6; i++) {
          const k = i / 6;
          game.flyers.push({ x: ax - k * ar * 1.6, y: ay - ar * 0.4 - k * k * ar * 2.2, c: 1, t: 0.1 });
        }
        for (let i = 0; i < 18; i++) {
          const a = rand() * Math.PI * 2;
          const d = rand() * ar;
          game.particles.push({ x: ax + Math.cos(a) * d, y: ay + Math.sin(a) * d, t: rand() * 0.3, life: 0.8, color: COLORS[1].hex, size: (1 + rand() * 1.4) * U });
        }

        // Supporting cast: other flocks, a moth lurking by the loop, the golden firefly.
        flock(2, 6, W * L.pink[0], H * L.pink[1], Math.min(W, H) * 0.08);
        flock(3, 5, W * L.lime[0], H * L.lime[1], Math.min(W, H) * 0.07);
        flock(1, 3, W * L.blue[0], H * L.blue[1], Math.min(W, H) * 0.05);
        game.moths.push({ x: cx + R * 1.15, y: cy + R * 0.3, vx: -20, vy: 10, ph: 1.2 });
        const g = { x: W * L.gold[0], y: H * L.gold[1], t: 2, life: 7.5 };
        game.golden = g;
        for (let i = 0; i < 14; i++) {
          game.particles.push({ x: g.x + (i + 1) * 5 * U, y: g.y + Math.sin(i * 0.6) * 8 * U, t: i * 0.03, life: 0.6, color: '#FFE36E', size: (1 + rand()) * U });
        }
        return game;
      }

      async function render(name, w, h, index) {
        Math.random = seeded(1234 + index);
        const W = w / SCALE;
        const H = h / SCALE;
        const game = stage(W, H);
        const canvas = document.createElement('canvas');
        const renderer = new Renderer(canvas);
        renderer.resize(W, H, SCALE, game.U);
        renderer.draw(game, 1.3);
        const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
        const url = URL.createObjectURL(blob);
        const fig = document.createElement('figure');
        fig.innerHTML = `<img src="${url}" alt="${name}"><figcaption>${name}.png · ${w}×${h}</figcaption>`;
        document.getElementById('shots').append(fig);
        const res = await fetch(`/save/${name}.png`, { method: 'POST', body: blob }).catch(() => null);
        return res && res.ok;
      }

      const realRandom = Math.random;
      let saved = 0;
      for (const [i, [name, w, h]] of SIZES.entries()) if (await render(name, w, h, i)) saved++;
      Math.random = realRandom;
      document.getElementById('status').textContent =
        saved === SIZES.length ? `Saved ${saved} thumbnails to store/thumbnails/` : 'Rendered. Start with "npm run thumbnails" to save them to disk.';
      window.thumbnailsDone = true;
    </script>
  </body>
</html>
